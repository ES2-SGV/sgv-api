spring.application.name=sgv-api
# Segredos de desenvolvimento ficam em application-local.properties, que está
# no .gitignore. O "optional:" faz a app subir normalmente sem ele.
spring.config.import=optional:file:./application-local.properties
server.port=${SERVER_PORT:8080}
# Credenciais NUNCA ficam neste arquivo: vêm do ambiente. Os defaults abaixo
# são só do banco local de desenvolvimento (ver db/README.md na pasta pai).
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgv_db}
spring.datasource.username=${DATASOURCE_USERNAME:sgv_api}
spring.datasource.password=${DATASOURCE_PASSWORD:}

# O schema é criado pelos scripts em db/ (pasta pai) e o usuário da API não
# tem permissão de DDL — a app só confere se o mapeamento bate. Para voltar a
# deixar o Hibernate criar tabelas em dev: JPA_DDL_AUTO=update, conectando com
# sgv_migrator.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

